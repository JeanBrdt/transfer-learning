[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "transfer_forest"
version = "0.1.0"
description = "Pipeline d'expériences de transfert pour forêts aléatoires"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
]

[project.optional-dependencies]
notebooks = ["matplotlib", "jupyter"]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["transfer_forest*"]
